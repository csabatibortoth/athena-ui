name: Deploy the demo to Azure App Service

# The demo (demo/) is deployed when master changes, and on request (Actions > Deploy the demo > Run workflow, any branch).
# One time set up: demo/README.md ("Deploying to Azure App Service").
#
#   GitHub environment "demo":
#     variable  AZURE_WEBAPP_NAME                the name of the App Service (Linux, Node 24)
#     secret    AZURE_WEBAPP_PUBLISH_PROFILE     the publish profile of that App Service (the whole XML file)
on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "demo/**"
      - "package.json"
      - ".github/workflows/demo-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two deployments at once would step on each other: the second waits (and is not cancelled half way)
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: demo
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Is the deployment set up?
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        run: |
          if [ -z "$APP_NAME" ]; then echo "::error::The variable AZURE_WEBAPP_NAME of the environment 'demo' is not set (demo/README.md)"; exit 1; fi
          if [ -z "$PROFILE" ]; then echo "::error::The secret AZURE_WEBAPP_PUBLISH_PROFILE of the environment 'demo' is not set (demo/README.md)"; exit 1; fi

      # demo/dist: server, API, the pages and a copy of src/ (Athena UI as it is in this commit). No dependencies, so Azure has nothing to install.
      - name: Build the package
        run: node demo/scripts/build-package.mjs

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: demo/dist

      # The site may need a minute to start. The check waits for the version that was just deployed, and looks at the security headers.
      - name: Check the deployed site
        run: node demo/scripts/smoke.mjs "${{ steps.deploy.outputs.webapp-url }}"
